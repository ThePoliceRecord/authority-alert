      description: |
        Install the previously uploaded OTA package.
        
        **Use Cases:**
        - Manual update installation
        - Offline updates
        - Staged updates
        
        **Business Logic:**
        - Verifies package integrity
        - Applies update based on package type
        - Reboots automatically on success
        
        **Warning:** Device will reboot after successful installation.
      operationId: applyUploadedUpdatePackage
      responses:
        '200':
          description: Update initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: No package staged or installation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

