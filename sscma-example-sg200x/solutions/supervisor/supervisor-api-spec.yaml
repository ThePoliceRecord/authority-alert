  /api/deviceMgr/getInternetStatus:
    get:
      tags:
        - System
      summary: Check internet connectivity
      description: |
        Check if the device has internet access by testing connectivity to reliable endpoints.

        **Use Cases:**
        - Network troubleshooting
        - OOBE connectivity verification
        - Dashboard status display

        **Business Logic:**
        - Tests multiple endpoints (Google, Cloudflare) for reliability
        - Returns latency measurement on success
        - 5 second timeout per endpoint
      operationId: getInternetStatus
      responses:
        '200':
          description: Internet status retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          available:
                            type: boolean
                            description: Whether internet access is available
                            example: true
                          latency_ms:
                            type: integer
                            description: Round-trip latency in milliseconds
                            example: 45
                          checked_host:
                            type: string
                            description: The endpoint used for the check
                            example: "https://clients3.google.com/generate_204"
                          error:
                            type: string
                            description: Error message if check failed

