  # QR Code Endpoints
  /api/qr/scan:
    post:
      tags:
        - QR Code
      summary: Start QR code scan
      description: |
        Start a QR code scanning session.
        
        **Use Cases:**
        - Device provisioning
        - WiFi credential sharing
        - Configuration import
        
        **Business Logic:**
        - Uses camera to scan QR codes
        - Configurable timeout
        - Returns scan ID for status polling
      operationId: startQRScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRScanRequest'
      responses:
        '200':
          description: Scan started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            example: "scan-123"

  /api/qr/scan/{id}:
    get:
      tags:
        - QR Code
      summary: Get QR scan status
      description: |
        Get the status of a QR code scanning session.
        
        **Use Cases:**
        - Poll for scan completion
        - Display scan progress
        - Retrieve scanned data
      operationId: getQRScanStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Scan session ID
      responses:
        '200':
          description: Scan status retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QRScanStatus'

    delete:
      tags:
        - QR Code
      summary: Cancel QR scan
      description: |
        Cancel an active QR code scanning session.
        
        **Use Cases:**
        - User cancellation
        - Timeout handling
        - Error recovery
      operationId: cancelQRScan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scan cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

