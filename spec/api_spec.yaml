openapi: "3.0.0"
info:
  title: The Police Record API Documentation
  version: 1.0.0
  description: API documentation for The Police Record application.
  contact:
    name: The Police Record
    url: https://thepolicerecord.com
    email: twhite@staff.thepolicerecord.com
  
tags:
  - name: Departments
    description: Operations related to departments
  - name: Officers
    description: Operations related to officers
  - name: Reports
    description: Operations related to reports
  - name: Watchlist
    description: Operations related to watchlists
  - name: Submissions
    description: Operations related to user submissions
  - name: admin
    description: Operations that require admin role
  - name: analyst
    description: Operations that require analyst role
  - name: Subscriptions
    description: Operations related to recurring subscriptions
  - name: VersionInfo
    description: Operations related to version information
  - name: ProfileData
    description: Operations related to user profile data
  - name: CsrfToken
    description: Operations related to CSRF tokens



servers:
  - url: http://localhost:8000
    description: Local server
  - url: https://dev.thepolicerecord.com
    description: Development server
  - url: https://thepolicerecord.com
    description: Production server
  
  

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ResponseWrapper:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "Success"
        data:
          type: object
          example: {"key": "value"}
        error:
          type: object
          example: {"key": "value"}

     
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          example: "123456"
  
    VersionInfo:
      type: object
      properties:
        android:
          type: string
          example: "1.0.0"
        ios:
          type: string
          example: "1.0.0"
        web:
          type: string
          example: "1.0.0"
      additionalProperties: false
    
    UserProfile:
      type: object
      properties:
        id : #primary key in postgres
          type: integer
          example: 1
        flagged:
          type: boolean
          example: false
        user_id:
          type: integer
          example: 1
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        profile_picture_url:
          type: string
          example: "https://example.com/photo.jpg"
        user_bio:
          type: string
          example: "This is a bio."
        created_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        points:
          type: integer
          example: 0
        account_type:
          type: string
          example: "User"
        is_on_mailing_list:
          type: boolean
          example: true
        achievements:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Achievement'
          example:
            - {"id": 1, "name": "Achievement Name", "description": "Achievement Description", "badge_url": "https://example.com/badge.jpg"}
            - {"id": 2, "name": "Achievement Name", "description": "Achievement Description", "badge_url": "https://example.com/badge.jpg"}
        strikes:
          type: integer
          example: 0
        permissions:
          type: object
          example: {"key": "value"}
        user_info:
          type: object
          example: {"key": "value"}
        access_token:
          type: string
          example: "123456"
        code:
          type: string
          example: "123456"
        refresh_token:
          type: string
          example: "123456"
        auth_state:
          type: string
          example: "123456"
        id_token:
          type: string
          example: "123456"
        sub: 
          type: string
          example: "123456"
        account_balance:
          type: number
          example: 100.00
        basic_report_subscriber:
          type: boolean
          example: true
        advanced_report_subscriber:
          type: boolean
          example: true
        non_expiring_basic_report_credits:
          type: integer
          example: 1
        non_expiring_advanced_report_credits:
          type: integer
          example: 1
        basic_report_credits:
          type: integer
          example: 1
        advanced_report_credits:
          type: integer
          example: 1
        unlimited_biometric_search_subscriber:
          type: boolean
          example: true
        basic_biometric_search_subscriber:
          type: boolean
          example: true
        advanced_biometric_search_subscriber:
          type: boolean
          example: true
        daily_biometric_search_credits:
          type: integer
          example: 1
        daily_biometric_reset_time:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        last_used_free_biometric_search:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        privacy_policy_accepted:
          type: boolean
          example: true
        terms_of_service_accepted:
          type: boolean
          example: true
        stripe_customer_id:
          type: string
          example: "123456"

      
    Achievement:
      type: object
      properties:
        id: #primary key in postgres
          type: integer
          example: 1
        name:
          type: string
          example: "Achievement Name"
        description:
          type: string
          example: "Achievement Description"
        badge_url:
          type: string
          example: "https://example.com/badge.jpg"

    OfficerSearchRequest:
      type: object
      properties:
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        badge_number:
          type: string
          example: "123456"
        department_name:
          type: string
          example: "Springfield Police Department"
        state:
          type: string
          example: "CA"
        city:
          type: string
          example: "Springfield"
        image:
          type: string #base64 encoded image
          example: "base64encodedimage"
        latitude:
          type: number
          example: 90.0000
        longitude:
          type: number
          example: 90.0000
        stream_id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        page:
          type: integer
          default: 1
          example: 1
        page_size:
          type: integer
          default: 10
          example: 10
      additionalProperties: false

    DepartmentSearchRequest:
      type: object
      properties:
        agency_name:
          type: string
          example: "Springfield Police Department"
        state:
          type: string
          example: "CA"
        city:
          type: string
          example: "Springfield"
        zip_code:
          type: string
          example: "12345"
        page:
          type: integer
          default: 1
          example: 1
        page_size:
          type: integer
          default: 10
          example: 10
      additionalProperties: false


    RecurringPurchase:
      type: object
      properties: 
        id:
          type: integer
          example: 1
        stripe_id:
          type: string
          example: "123456" 
        subscription_id:
          type: string
          example: "123456"
        payment_intent_id:
          type: string
          example: "123456"
        billing_reason:
          type: string
          example: "Reason"
        invoice_url:
          type: string
          example: "https://example.com"
        invoice_pdf_url:
          type: string
          example: "https://example.com"
        product:
          type: integer
          example: 1
        user:
          type: integer
          example: 1  
        created_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        stripe_json:
          type: object
          example: {"key": "value"} 
        account_credited_timestamp:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        sponsorship:
          type: boolean
          example: true
        sponsorship_id:
          type: integer
          example: 1  
        cancelled_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        next_billing_date:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z 
        last_billing_date:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z 
        last_payment_date:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z 
        last_payment_amount:
          type: number
          example: 100.00
        idempotency_key:  
          type: string
          example: "123456"  


    Error:
      type: object
      properties:
        code:
          type: integer
          example: 403
        message:
          type: string
          
          example: "You do not have permission to perform this action."
        data:
          type: object
          example: {"key": "value"}

     
    UserSubmission:
      type: object
      properties:
        submission_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        user_id:
          type: integer
          example: 1
        submitted_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
        badge_number:
          type: string
          example: 123456
        may_work_at:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        first_name:
          type: string
          example: John
        middle_name:
          type: string
          example: Doe
        last_name:
          type: string
          example: Smith
        current_rank:
          type: string
          enum:
            - Officer
            - Sergeant
            - Lieutenant
            - Captain
            - Deputy Chief
            - Chief
            - Detective
            - Corporal
            - Agent
            - Trooper
            - Sheriff
            - Marshal
            - Constable
            - Inspector
            - Commissioner
            - Superintendent
            - Commander
            - Assistant Chief
          example: Officer
        gender:
          type: string
          enum:
            - Male
            - Female
            - Other
          example: Male
        race:
          type: string
          enum:
            - Caucasian
            - Asian
            - African
            - Hispanic
            - Native American
            - Pacific Islander
            - Middle Eastern
            - Other
          example: Caucasian
        age:
          type: integer
          example: 30
        photos:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

        is_undercover:
          type: boolean
          example: false
        notes:
          type: string
          example: "This is a note."
        status:
          type: string
          example: "Pending"

    SubmissionPhoto:
      type: object
      properties: 
        photo_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        url:
          type: string
          example: "https://example.com/photo.jpg"
        submission:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    Stream:
      type: object
      properties:
        error_message:
          type: string
          example: "Error message"
        error_time:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        type:
          type: string
          example: "Stream"
        uuid:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        url:
          type: string
          example: "https://example.com/stream.m3u8"
        codec_name:
          type: string
          example: "h264"
        queue_time:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        start_time:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        user_id:
          type: string
          example: "1"
        width:
          type: integer
          example: 1920
        processing_time:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        state:
          type: string
          example: "Running"
        height:
          type: integer

        officers:
          type: array
          items:
            type: string
            format: uuid
          example:
            - 123e4567-e89b-12d3-a456-426614174000
            - 123e4567-e89b-12d3-a456-426614174001
        department:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

        end_time:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        status:
          type: string
          example: "Pending"
        mtx_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        photos:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/SubmissionPhoto'

    Record:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          example: "Title"
        url:
          type: string
          example: "https://example.com"
        website:
          type: string
          example: "Website"
        content:
          type: string
          example: "Content"
        record_type:
          type: string
          example: "Video"
        post_quarantine_url:
          type: string
          example: "https://example.com"
        created_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        discovered_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        last_accessed_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        object_detection:
          type: array
          items:
            type: string
          example:
            - "Person"
            - "Car"
            - "Gun"
        record_source:
          type: string
          example: "Web Upload"
        sentiment_analysis:
          type: array
          items:
            type: string
          example:
            - "Positive"
            - "Negative"
            - "Neutral"
        from_official_source:
          type: boolean
        status:
          type: string
          example: "Pending"
        known_officers:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        departments:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    Report:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        match_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          example: "Title"
        created_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        generated_at:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        last_viewed_at:
